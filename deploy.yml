---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingupdate:
      maxSurge: 2
      maxUnavailable: 2
  template:
    metadata:
      name: mytemp
      matchLabels:
        app: swiggy
    spec:
      containers:
        - name: cont1
          image: shaikmustafa/dm
          ports:
            - containerPort: 80
