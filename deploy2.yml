---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingupdate:
      maxSurge: 3
      maxUnavailable: 2
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      name: mytemp
      labels:
        app: zomato
    spec:
      containers:
        - name: cont1
          image: shaikmustafa/paytm:movie
          ports:
            - containerPort: 80
